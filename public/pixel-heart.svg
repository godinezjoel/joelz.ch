<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" shape-rendering="crispEdges">
  <!-- Border (Black) -->
  <rect x="2" y="0" width="2" height="1" fill="black" />
  <rect x="5" y="0" width="2" height="1" fill="black" />
  <rect x="1" y="1" width="1" height="1" fill="black" />
  <rect x="4" y="1" width="1" height="1" fill="black" />
  <rect x="7" y="1" width="1" height="1" fill="black" />
  <rect x="0" y="2" width="1" height="2" fill="black" />
  <rect x="8" y="2" width="1" height="2" fill="black" />
  <rect x="1" y="4" width="1" height="1" fill="black" />
  <rect x="7" y="4" width="1" height="1" fill="black" />
  <rect x="2" y="5" width="1" height="1" fill="black" />
  <rect x="6" y="5" width="1" height="1" fill="black" />
  <rect x="3" y="6" width="1" height="1" fill="black" />
  <rect x="5" y="6" width="1" height="1" fill="black" />
  <rect x="4" y="7" width="1" height="1" fill="black" />

  <!-- Red Fill -->
  <rect x="2" y="1" width="2" height="1" fill="#ef4444" />
  <rect x="5" y="1" width="2" height="1" fill="#ef4444" />
  <rect x="1" y="2" width="7" height="1" fill="#ef4444" />
  <rect x="1" y="3" width="7" height="1" fill="#ef4444" />
  <rect x="2" y="4" width="5" height="1" fill="#ef4444" />
  <rect x="3" y="5" width="3" height="1" fill="#ef4444" />
  <rect x="4" y="6" width="1" height="1" fill="#ef4444" />

  <!-- White Highlight (optional but makes it look like Minecraft) -->
  <rect x="2" y="2" width="1" height="1" fill="white" opacity="0.5"/>
</svg>
